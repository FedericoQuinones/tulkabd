[package]
name = "tulka-mcp"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server that gives AI assistants read-only access to tulkabd connections"

[dependencies]
tulka-app = { path = "../tulka-app" }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "macros", "transport-async-rw"] }
tulka-core = { path = "../tulka-core" }
tulka-mssql = { path = "../tulka-mssql" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = "1"
