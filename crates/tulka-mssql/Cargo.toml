[package]
name = "tulka-mssql"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vendored and patched fork of tiberius 0.13.0, see vendor/tiberius/TULKA_PATCHES.md.
tiberius = { path = "../../vendor/tiberius", default-features = false, features = ["tds73", "rustls", "chrono"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
