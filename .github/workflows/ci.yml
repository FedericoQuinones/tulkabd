name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm vitest run
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Windows-only code (Windows authentication) is linted and tested only here.
      - run: cargo clippy -p tulka-core -p tulka-mssql -p tulka-store -p tulka-mcp -p tulka-app --all-targets -- -D warnings
      - run: cargo test -p tulka-core -p tulka-mssql -p tulka-store -p tulka-mcp -p tulka-app

  bundle:
    needs: [test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      # On Windows this exercises the GUI-subsystem exe with piped stdio, as an AI client launches it.
      - name: MCP over stdio (release binary)
        shell: bash
        run: |
          exe=target/release/tulkabd
          if [ "$RUNNER_OS" = "Windows" ]; then exe=target/release/tulkabd.exe; fi
          node scripts/mcp-ci-probe.mjs "$exe"
      - uses: actions/upload-artifact@v4
        with:
          name: tulkabd-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
